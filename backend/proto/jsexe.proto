syntax = "proto3";

package jsexe;

// JsExe Service - Execute JavaScript code in isolated environment
service JsexeService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

message ExecuteRequest {
  string code = 1;
}

message ExecuteResponse {
  bool success = 1;
  string result = 2;
  string error = 3;
}
